function overview(){const s=summary(),missing=state.components.filter(c=>c.enabled&&c.missing?.length).length;return head('Observatory overview','A living budget for a segmented, self-assembling optical telescope. Change a component or select a trade and follow the impact through the system.')+`<div class="metrics">${stat('Module wet design mass',s.wetPerBus,'kg',`Includes ${fmt(state.mission.massMargin*100)}% dry margin + propellant`)}${stat('Observatory wet design mass',s.totalWet,'kg',`${fmt(s.buses,0)} modular buses · allocated mean bus`)}${stat('EOL power headroom',s.powerHeadroomPerBus,'W',`${esc(state.mission.mode)} · per bus · ${fmt(state.mission.powerMargin*100)}% load margin`,s.powerHeadroomPerBus>=0?'positive':'negative')}${stat('Reflecting area',s.reflectingAreaM2,'m²',`${fmt(s.segments,0)} segments · ${fmt(state.project.fillFactor*100)}% target fill`)}</div><div class="gridwide">${panel('Aperture architecture',`<div class="schema">${telescope()}<div class="schemastats"><div><small>SEGMENT FLAT-TO-FLAT</small><b>${fmt(state.project.segmentFtfM)} m</b></div><div><small>ACTIVE MIRROR TRADE</small><b style="font-size:15px">${esc(state.mirrorTrades.find(t=>t.id===state.mirrors.selectedId)?.name)}</b></div><div><small>SEGMENTS / BUS</small><b>${fmt(state.project.segmentsPerBus,0)}</b></div></div></div><div class="caption">Representative schematic. Segment count is an area estimate; edge packing, pupil layout and structural feasibility are unresolved.</div>`,action('Configure architecture →','nav','architecture','small ghost'))}${panel('Study controls',`<div class="fields">${input('Aperture diameter','project.apertureM','m',{min:.01})}${input('Segment flat-to-flat','project.segmentFtfM','m',{min:.01})}${input('Reflecting fill fraction','project.fillFactor','0–1',{max:1,min:.01})}${input('Dry mass margin','mission.massMargin','0–1',{max:1})}${input('Design load margin','mission.powerMargin','0–1',{max:2})}${input('Module mass allocation','mission.massLimitKg','kg',{min:.01})}</div><hr class="divider"><div class="statusline"><span class="dot"></span><span id="savestatus">Autosaved on this browser · Export for project backup</span></div>`)}</div><div class="grid2">${panel('Where the mass goes',massChart(),action('Open mass ledger →','nav','architecture','small ghost'))}${panel('Does the power close?',powerChart(),action('Open power model →','nav','power','small ghost'))}</div>${note(`<b>Budget completeness is open.</b> ${missing} included component records have missing source data; peak loads default to nominal where unknown. Mirror actuators, assembly hardware and optical performance need definition. Review <button class="tablelink" data-action="nav" data-id="data">source assumptions</button> before using the totals.`)}${panel('Live requirement checks',requirementList(false),action('Manage requirements →','nav','requirements','small ghost'))}`;}
function architecture(){const s=summary();return head('Architecture & mass','Set the module geometry, material and aperture scaling. A single ledger accounts for every included item; margins and propellant stay visible.')+`<div class="metrics">${stat('CBE dry / bus',s.dryCBEPerBus,'kg','Current best estimate · no system margin')}${stat('Design dry / bus',s.designDryPerBus,'kg','CBE dry with one system margin')}${stat('Propellant / bus',s.propellantPerBus,'kg','Delta-v sizing · reserve and residuals')}${stat('Wet design / bus',s.wetPerBus,'kg','Design dry + loaded propellant')}</div><div class="grid2">${panel('Observatory scaling',`<div class="fields">${input('Project name','project.name','',{text:true,wide:true})}${input('Aperture diameter','project.apertureM','m',{min:.01})}${input('Segment flat-to-flat','project.segmentFtfM','m',{min:.01})}${input('Reflecting fill fraction','project.fillFactor','0–1',{max:1,min:.001})}${input('Segments supported per bus','project.segmentsPerBus','',{min:1,step:1})}${select('Segment count','project.segmentCountMode',[['area','Estimate from aperture area'],['manual','Manual count']])}${input('Manual segments','project.manualSegments','',{min:1,step:1})}${select('Bus count','project.busCountMode',[['auto','From segments / bus'],['manual','Manual count']])}${input('Manual buses','project.manualBuses','',{min:1,step:1})}</div><hr class="divider">${row('Hex area / segment',`${fmt(s.segmentAreaM2,3)} m²`)}${row('Segments / buses',`${fmt(s.segments,0)} / ${fmt(s.buses,0)}`)}<div class="caption">All geometry uses flat-to-flat dimensions. Manual segment count is independent of the target aperture; actual collecting area is count × segment area.</div>`) }${panel('Bus shell model',`${check('Include bus shell and internal allowance','structure.enabled')}<div class="fields">${select('Shell shape','structure.shape',[['hex','Closed hexagonal prism'],['box','Closed rectangular box']])}${select('Material preset','structure.materialPreset',[['custom','Custom / current density'],['al','Aluminum 6061 · workbook'],['cfrp','Graphite composite · workbook']])}${input('Width / hex flat-to-flat','structure.widthM','m',{min:.01})}${input('Box length','structure.lengthM','m',{min:.01})}${input('Bus height','structure.heightM','m',{min:.01})}${input('Wall thickness','structure.thicknessMm','mm',{min:.001})}${input('Material density','structure.densityKgM3','kg/m³',{min:1})}${input('Effective shell coverage','structure.coverage','0–1',{max:1})}${input('Internal support allowance','structure.extraKg','kg')}${input('Dry mass margin','mission.massMargin','0–1',{max:1})}</div>${note('Thin-wall shell estimate. Width and height are independent of mirror size. The 60.75 kg internal support allowance preserves the source’s fixed support term; change it when your design is defined. Density does not establish stiffness or strength.','cool')}`)}</div>${panel('Traceable mass and load ledger',`<div class="tablewrap"><table><thead><tr><th>Included element</th><th>Basis</th><th class="num">Dry kg / bus</th><th class="num">Mode avg W / bus</th><th class="num">Peak W / bus</th><th class="num">Fleet dry kg</th></tr></thead><tbody>${ledgerRows().filter(l=>l.id!=='propellant').map(l=>`<tr><td>${esc(l.name)}<small>${esc(l.subsystem||l.category||'')}</small></td><td>${esc(l.scope||'derived')}</td><td class="num">${fmt(l.massPerBusKg??l.totalMassKg/s.buses)}</td><td class="num">${fmt(l.avgWPerBus??l.totalAvgW/s.buses)}</td><td class="num">${fmt(l.peakWPerBus??l.totalPeakW/s.buses)}</td><td class="num">${fmt(l.totalMassKg)}</td></tr>`).join('')}</tbody></table></div>${row('CBE dry total',`${fmt(s.dryCBEPerBus)} kg / bus`)}${row('System dry margin (applied once)',`${fmt(s.designDryPerBus-s.dryCBEPerBus)} kg / bus`)}${row('Loaded propellant',`${fmt(s.propellantPerBus)} kg / bus`)}${row('Wet design total',`${fmt(s.wetPerBus)} kg / bus`)}`)}`;}
function componentTable(list=state.components){const indexed=list.map(c=>[c,state.components.indexOf(c)]).filter(([c])=>(category==='All systems'||c.subsystem===category)&&(!filter||(c.name+' '+c.subsystem+' '+c.vendor+' '+c.model).toLowerCase().includes(filter.toLowerCase())));return `<div class="tablewrap"><table><thead><tr><th>Include</th><th>Equipment / status</th><th class="num">Unit kg</th><th class="num">Installed</th><th class="num">Active</th><th class="num">Failed</th><th class="num">Unit W</th><th class="num">Duty</th><th></th></tr></thead><tbody>${indexed.map(([c,i])=>`<tr class="${c.enabled?'':'rowoff'}"><td><input type="checkbox" data-path="components.${i}.enabled" ${c.enabled?'checked':''} aria-label="Include ${esc(c.name)}"></td><td class="cellname"><button class="tablelink" data-action="editcomponent" data-id="${i}">${esc(c.name)}</button><small>${esc(c.subsystem)} · ${esc(c.scope)} · ${esc(c.status)}</small>${state.tradeSets.some(t=>t.targetId===c.id&&t.selectedId)?tag('Linked trade','neutral'):''}</td>${['massKg','installed','active','failed','powerW'].map(k=>`<td class="num"><input type="number" min="0" step="${['installed','active','failed'].includes(k)?'1':'any'}" data-path="components.${i}.${k}" value="${c[k]}" aria-label="${esc(c.name)} ${k}"></td>`).join('')}<td class="num"><input type="number" min="0" max="1" step=".05" data-path="components.${i}.duty.${state.mission.mode}" value="${c.duty[state.mission.mode]}" aria-label="${esc(c.name)} ${state.mission.mode} duty"></td><td>${action('Details','editcomponent',i,'small ghost')}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">No equipment matches this filter.</td></tr>'}</tbody></table></div>`;}
function components(){const s=summary();return head('A plug-and-play equipment model','Add actual hardware as datasheets become available. Installed units drive mass; operating units, spares, failures and mode duty drive electrical load.')+`<div class="subtools"><div class="left"><input id="filter" placeholder="Search equipment, vendor or model…" value="${esc(filter)}" aria-label="Search equipment"><select id="category" aria-label="Filter subsystem">${['All systems',...new Set(state.components.map(c=>c.subsystem))].map(x=>`<option ${category===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>${action('+ Add component','addcomponent','','primary')}</div><div class="panel">${componentTable()}</div>${note('Include means physically installed. Failed hardware retains its mass. To switch a spare off electrically, use standby watts and mode duty; unchecking Include removes the hardware from the study. Linked trade values override base unit mass and power until that trade is deselected.','cool')}<div class="grid2">${panel('Model conventions',row('Equipment records',fmt(state.components.length,0))+row('Current operating mode',esc(state.mission.mode))+row('Physical dry CBE / bus',`${fmt(s.dryCBEPerBus)} kg`)+row('Actual average load / bus',`${fmt(s.avgPowerPerBus)} W`))}${panel('What to capture from a datasheet','<p>Use Details to enter manufacturer, model, source link, source date, rating basis, mass, nominal / peak / standby power, and mode duties. Each record supports a per-bus, per-segment or observatory-wide quantity basis.</p><p>Change “Missing data” status only after replacing the placeholder values. Enter shared dependencies to document common power, software and thermal vulnerabilities.</p>')}</div>`;}
function power(){const s=summary();return head('Power & energy','Separate generation, storage and operating loads. Check sustainable energy, eclipse endurance, peak discharge and recharge capacity.')+`<div class="metrics">${stat('EOL generation / bus',s.generationPerBus,'W','Solar + constant sources · after selected failures')}${stat('Actual mode average / bus',s.avgPowerPerBus,'W','Power margin is tracked separately')}${stat('Usable storage / bus',s.usableWhPerBus,'Wh','EOL × depth of discharge × discharge efficiency')}${stat('Repeatable storage margin / bus',s.cycleEnergyMarginWhPerBus,'Wh','Per-bank discharge / recharge capacity minus demand',s.cycleEnergyMarginWhPerBus>=0?'positive':'negative')}</div><div class="grid2">${panel('Operating environment',`<div class="fields">${input('Distance from Sun','mission.distanceAU','AU',{min:.01})}${input('Solar flux at 1 AU','mission.solarFluxWm2','W/m²',{min:1})}${input('Sunlit interval','mission.sunlightH','h',{min:.001})}${input('Eclipse interval','mission.eclipseH','h')}${input('Design load margin','mission.powerMargin','0–1',{max:2})}</div>${note('Orbit has not been selected. The initial 24 h sunlit / 0 h eclipse cycle is an editable study assumption, not an L2 ephemeris. Power is pooled at observatory level; local wiring and bus isolation are not verified.','cool')}`)}${panel('Power closure',powerChart()+row('Design eclipse energy',`${fmt(s.eclipseRequiredWhPerBus)} Wh / bus`)+row('Peak supply margin',`${fmt(s.peakPowerMarginPerBus)} W / bus`)+row('Recharge power margin',`${fmt(s.chargeMarginWPerBus)} W / bus`)+powerChecks())}</div><div class="subtools"><div><h2 style="font-size:17px;font-weight:500;margin:0">Generation & storage inventory</h2><p class="summaryline">Scope, installed count and failures are editable for every source.</p></div><div class="tools">${action('+ Solar','addsource','solar')}${action('+ Battery','addsource','battery')}${action('+ Constant source','addsource','constant')}</div></div><div class="cards">${state.sources.map((x,i)=>`<section class="tradecard ${x.enabled?'':'rowoff'}"><div class="tagline">${tag(x.kind.toUpperCase(),'neutral')}${tag(`${x.installed-x.failed}/${x.installed} available`,x.failed?'warn':'')}</div><h3>${esc(x.name)}</h3><p>${esc(x.kind==='battery'?`${fmt(x.energyWh)} Wh per unit · ${fmt(x.maxDischargeW)} W discharge cap`:x.kind==='solar'?(x.ratingMode==='rated'?`${fmt(x.ratedW)} W net EOL rating per unit`:`${fmt(x.areaM2)} m² per unit · ${fmt(x.efficiency*100)}% cells`):`${fmt(x.ratedW)} W continuous per unit`)}</p><div class="meta">${esc(x.scope)} · ${esc(x.status||'Study input')}<br>Mass mode: ${x.kind==='solar'?esc(x.solarMassMode):x.kind==='battery'?esc(x.batteryMassMode):'manual'}</div><div class="actions">${action('Configure →','editsource',i,'primary small')}${action(x.enabled?'Exclude':'Include','togglesource',i,'small ghost')}</div></section>`).join('')}</div>${note('The workbook supplies array and battery masses but no validated generation or storage ratings. Initial efficiency, energy density, losses and charge / discharge limits are illustrative. Sustainable energy must close without treating a battery as a net source.')}`;}
function control(){const s=summary();return head('ACS, propulsion & fault capacity','Replace equipment independently, select failures, and resize propellant from a delta-v requirement. Capacity checks expose selected shortages without claiming mission reliability.')+`<div class="metrics">${stat('Loaded propellant / bus',s.propellantPerBus,'kg','Reserve is applied to delta-v; residual is unusable')}${stat('Propellant volume / bus',(s.propellantVolumeM3PerBus||0)*1000,'L','Liquid / material volume · no tank ullage')}${stat('Nominal burn time',s.burnTimeS/3600,'h','Ideal mass flow at active thrust · no power feasibility')}${stat('Current design wet / bus',s.wetPerBus,'kg','Recalculates with all mass changes')}</div><div class="grid2">${panel('Propulsion sizing',`${check('Include propulsion hardware and propellant','propulsion.enabled')}<div class="fields">${input('Propellant / technology','propulsion.propellant','',{text:true,wide:true})}${input('Specific impulse','propulsion.ispS','s',{min:.01})}${input('Required delta-v','propulsion.deltaVMs','m/s')}${input('Delta-v reserve fraction','propulsion.reserveFraction','0–1',{max:2})}${input('Unusable residual fraction','propulsion.residualFraction','0–1',{max:.9})}${input('Dry hardware per installed set','propulsion.dryKg','kg')}${input('Additional tank mass / loaded propellant','propulsion.tankFraction','kg/kg',{max:2})}${input('Propellant density','propulsion.densityKgM3','kg/m³',{min:.01})}${input('Thrust per operating set','propulsion.thrustN','N',{min:.000001})}${input('Installed sets per bus','propulsion.installed','',{step:1,min:1})}${input('Failed sets per bus','propulsion.failed','',{step:1})}${input('Required operating sets','propulsion.requiredActive','',{step:1,min:1})}${input('Power per operating set','propulsion.operatingW','W')}${input('Maneuver mode duty','propulsion.duty','0–1',{max:1})}</div>${note('Propellant defaults are illustrative; only 25 kg dry hardware comes from the workbook. That allowance may already include tanks: keep added tank fraction at zero until a consistent breakdown is available. Sizing assumes the same delta-v and Isp with dry mass allocated evenly across modules.','cool')}`)}${panel('Fault-capacity checks',`<div class="checklist">${failureList()}</div>${note('A sufficient unit count does not prove three-axis control, failover behavior or optical pointing. Wheel axes, torque, momentum, desaturation, common controllers and shared power remain separate analyses.')}<div class="tools">${action('Clear all selected failures','clearfailures','','small ghost')}${action('Add ACS component','addacs','','small primary')}</div>`)}</div><div class="panel"><div class="panelhead"><h2>ACS equipment · quantities and mode loads</h2><span>${esc(state.mission.mode)} mode</span></div>${componentTable(state.components.filter(x=>x.subsystem==='ACS'))}</div>${note('Magnetic torquers require a suitable local magnetic field. For L2 or deep-space operations, define an alternate momentum unloading system. Electric thrusters also need a feasible electrical power and thermal budget; Isp alone does not establish capability.')}`;}
function failureList(){const rows=state.components.filter(c=>c.enabled).map(c=>({name:c.name,available:c.installed-c.failed,required:c.minRequired,failed:c.failed}));if(state.propulsion.enabled)rows.push({name:'Propulsion sets / bus',available:state.propulsion.installed-state.propulsion.failed,required:state.propulsion.requiredActive,failed:state.propulsion.failed});return rows.filter(x=>x.failed||x.required>0).map(x=>`<div class="checkitem"><div>${esc(x.name)}<span class="explain">${x.available} available / ${x.required} required${x.failed?' · '+x.failed+' selected failure(s)':''}</span></div>${tag(x.available>=x.required?'Count sufficient':'Shortfall',x.available>=x.required?'':'bad')}</div>`).join('');}
function trades(){const s=summary();return head('Mirror & component trade studies','Choose an option and the live system budget follows it. Compare substrate mass separately from backplanes and actuators; add more trade families as the design matures.')+`<div class="subtools"><div><h2 style="font-size:17px;font-weight:500;margin:0">Primary mirror substrate</h2><p class="summaryline">${fmt(s.segmentAreaM2,3)} m² per hexagonal segment · substrate-only source estimates</p></div>${action('+ Mirror option','addmirror','','primary')}</div><div class="cards">${state.mirrorTrades.map((t,i)=>{const ar=t.massMode==='areal'?t.arealKgM2:t.densityKgM3*t.thicknessMm/1000*t.solidFraction;return `<section class="tradecard ${state.mirrors.selectedId===t.id?'selected':''}"><div class="tagline">${tag(t.massMode==='areal'?'AREAL DENSITY':'VOLUMETRIC','neutral')}${state.mirrors.selectedId===t.id?tag('Selected'):''}</div><h3>${esc(t.name)}</h3><div class="big">${fmt(ar*s.segmentAreaM2)} <small>kg / substrate</small></div><p>${fmt(ar)} kg/m² · ${t.massMode==='areal'?'editable source estimate':`${fmt(t.thicknessMm)} mm × ${fmt(t.solidFraction*100)}% solid`}</p><div class="meta">WFE: ${t.wfeNm>0?fmt(t.wfeNm)+' nm':'TBD'} · TRL: ${t.trl>0?fmt(t.trl,0):'TBD'}<br>${esc(t.source||'Custom concept option')}</div><div class="actions">${action(state.mirrors.selectedId===t.id?'Active option':'Select option','selectmirror',t.id,'small '+(state.mirrors.selectedId===t.id?'ghost':'primary'))}${action('Edit','editmirror',i,'small ghost')}</div></section>`;}).join('')}</div>${note('Selecting a trade is a mass / power budget choice. Optical surface error, CTE, coatings, operating temperature and diffraction / phasing performance require separate verification. The workbook’s blank Zerodur and aluminum masses are not imported as zero-mass options.','cool')}<div class="subtools"><div><h2 style="font-size:17px;font-weight:500;margin:0">Mirror positioning actuators</h2><p class="summaryline">A linked actuator choice adds count × unit mass and mode load per mirror segment.</p></div>${action('+ Actuator option','addactuator','','primary')}</div><div class="cards">${state.actuatorTrades.map((t,i)=>`<section class="tradecard ${state.mirrors.actuatorId===t.id?'selected':''}"><div class="tagline">${tag(t.status||'Study input',t.countPerSegment?'neutral':'warn')}${state.mirrors.actuatorId===t.id?tag('Selected'):''}</div><h3>${esc(t.name)}</h3><div class="big">${fmt(t.countPerSegment*t.massKg)} <small>kg / segment</small></div><p>${fmt(t.countPerSegment,0)} units × ${fmt(t.massKg)} kg · ${fmt(t.powerW)} W operating / unit<br>Resolution ${t.resolutionNm>0?fmt(t.resolutionNm)+' nm':'TBD'} · stroke ${t.strokeMm>0?fmt(t.strokeMm)+' mm':'TBD'}</p><div class="actions">${action(state.mirrors.actuatorId===t.id?'Active option':'Select option','selectactuator',t.id,'small '+(state.mirrors.actuatorId===t.id?'ghost':'primary'))}${action('Edit','editactuator',i,'small ghost')}</div></section>`).join('')}</div><div class="subtools"><div><h2 style="font-size:17px;font-weight:500;margin:0">Other component trade families</h2><p class="summaryline">Bind an extensible trade family to any equipment record, such as Honeywell ACS units, antennas or controllers.</p></div>${action('+ Trade family','addfamily','','primary')}</div>${state.tradeSets.length?state.tradeSets.map((t,i)=>panel(esc(t.name),`<div class="fields">${select('Target component',`tradeSets.${i}.targetId`,state.components.map(c=>[c.id,c.name]))}${select('Active option',`tradeSets.${i}.selectedId`,[['','Use base component values'],...t.options.map(o=>[o.id,o.name])])}</div><div class="tablewrap"><table><thead><tr><th>Trade option</th><th class="num">Unit kg</th><th class="num">Nominal W</th><th class="num">Peak W</th><th></th></tr></thead><tbody>${t.options.map((o,j)=>`<tr><td>${esc(o.name)}<small>${esc(o.notes)}</small></td><td class="num">${fmt(o.massKg)}</td><td class="num">${fmt(o.powerW)}</td><td class="num">${fmt(o.peakW)}</td><td>${action('Edit','editoption',i+':'+j,'small ghost')}</td></tr>`).join('')}</tbody></table></div><div class="tools" style="margin-top:15px">${action('+ Add option','addoption',i,'small')}${action('Rename / remove family','editfamily',i,'small ghost')}</div>`)).join('<br>'):panel('Ready for the next study','<p>Add a trade family, choose the component it affects, and enter alternative hardware mass and power. Selection overrides those unit values in the live model while quantities, failure state, and mode duties stay with the component.</p>')}`;}
function reqValue(r){const s=summary();if(r.metric==='wfeNm')return state.mirrorTrades.find(t=>t.id===state.mirrors.selectedId)?.wfeNm||null;if(r.metric==='actuatorResolutionNm')return state.actuatorTrades.find(t=>t.id===state.mirrors.actuatorId)?.resolutionNm||null;return s[r.metric];}
function requirementList(edit){return `<div class="checklist">${state.requirements.map((r,i)=>{const v=reqValue(r),known=Number.isFinite(v),pass=known&&(r.op==='<='?v<=r.limit:v>=r.limit);return `<div class="checkitem"><div>${esc(r.name)}<span class="explain">${esc(r.metric)} ${esc(r.op)} ${fmt(r.limit)} ${esc(r.unit)} · current ${known?fmt(v):'TBD'} ${esc(r.unit)}</span></div><div class="horizontal">${tag(known?(pass?'Within limit':'Outside limit'):'Unspecified',known?(pass?'':'bad'):'warn')}${edit?action('Edit','editreq',i,'small ghost'):''}</div></div>`;}).join('')||'<div class="empty">No requirements yet.</div>'}</div>`;}
function requirements(){const s=summary();return head('Requirements & saved cases','Keep allocations and candidate designs reviewable. Scenario snapshots retain the full project; restore one to continue a prior branch.')+`<div class="grid2">${panel('Live engineering requirements',requirementList(true)+`<div style="margin-top:18px">${action('+ Add requirement','addreq','','primary small')}</div>`)}${panel('Capture a study case',`<p>Save the current configuration before a component substitution, material change or failure study. Cases include the entire active model and the selected operating mode.</p><div class="fields"><label class="field span2"><span class="flabel">Case name</span><input id="snapshotname" placeholder="e.g. SiC + redundant avionics"></label></div><div style="margin-top:18px">${action('Save current scenario','snapshot','','primary')}</div>${note('Snapshots and edits autosave only in this browser when storage is available. Export the project JSON regularly to keep a durable, portable backup. A downloaded dashboard also carries an embedded project copy.','cool')}`)}</div>${panel('Case comparison',`<div class="tablewrap"><table><thead><tr><th>Scenario</th><th>Mode</th><th class="num">Wet kg / bus</th><th class="num">Fleet wet kg</th><th class="num">Average W / bus</th><th class="num">Headroom W / bus</th><th></th></tr></thead><tbody><tr><td><b>Current model</b></td><td>${esc(state.mission.mode)}</td><td class="num">${fmt(s.wetPerBus)}</td><td class="num">${fmt(s.totalWet)}</td><td class="num">${fmt(s.avgPowerPerBus)}</td><td class="num">${fmt(s.powerHeadroomPerBus)}</td><td>${tag('Live')}</td></tr>${state.snapshots.map((x,i)=>{const r=TelescopeModel.calculate(x.state).summary;return `<tr><td>${esc(x.name)}<small>${esc(new Date(x.created).toLocaleString())}</small></td><td>${esc(x.state.mission.mode)}</td><td class="num">${fmt(r.wetPerBus)}</td><td class="num">${fmt(r.totalWet)}</td><td class="num">${fmt(r.avgPowerPerBus)}</td><td class="num">${fmt(r.powerHeadroomPerBus)}</td><td><div class="tools">${action('Restore','restore',i,'small')}${action('Delete','deletesnapshot',i,'small ghost')}</div></td></tr>`;}).join('')}</tbody></table></div>`)}${panel('Interpretation',`<p>Requirement checks compare scalar allocations and do not verify optical, structural or operational feasibility. Missing WFE / actuator resolution stays “Unspecified.” The initial module wet-mass allocation is linked to the Architecture control. Custom requirements hold independent limits.</p><p>Mass is retained under failures. Power may drop when hardware fails; a lower electrical load is not a successful operational case if capacity checks show a shortfall.</p>`)}`;}
function data(){const issues=SOURCE.issues||SOURCE.auditIssues||SOURCE.findings||[];return head('Source traceability & model notes','The spreadsheet is retained as evidence. Its totals do not drive corrected rollups; imported leaves, explicit assumptions and selected trades drive the live model.')+`<div class="grid2">${panel('Project portability',`<div class="steps">${row('Edit hardware and selected trades','Live recomputation')}${row('Save a named scenario','Full configuration snapshot')}${row('Export project JSON','Inputs + snapshots + schema v1')}${row('Export a portable dashboard','Current project embedded')}</div><div class="tools" style="margin-top:18px">${action('Export project JSON','export','','primary')}${action('Export portable dashboard','exporthtml')}${action('Export budget CSV','exportcsv')}</div>${note('This is a local concept-study application. No collaborative server, automatic datasheet parser, external database, vendor qualification or independent engineering verification is connected. Add reviewed datasheet values and provenance manually; future hardware uses the same records.','cool')}`)}${panel('Workbook import reconciliation',`<p><b>BUDGETS_final(1).xlsx</b> · 13 worksheets. Known detailed loads total <b>491.1 W per source module</b>; unknown loads remain open. Source geometry was 3 m corner-to-corner despite the FTF label.</p>${row('Source module dry CBE (corrected leaves)','1,063.135 kg')}${row('Original main segment count','7')}${row('Original mirror sheet count','6')}${row('Source shell + mirror area','5.845671 m² / segment')}${row('Dashboard 3 m FTF mirror area','7.794229 m² / segment')}<p style="margin-top:14px">The corrected leaf total is a source-geometry reference, not the current 1 km study total. Current FTF geometry, margins, source assumptions and selected trades change it.</p>`)}</div>${panel('Source findings',`<div class="checklist">${(issues.length?issues:[{title:'Inconsistent geometry and counts',description:'Source FTF label used corner-to-corner formulas; main counts 7 segments while Mirror mass counts 6.'},{title:'Duplicate propulsion / shell and fleet mass formula',description:'ACS includes 25 kg propulsion dry, which SC bus adds again. Main total omits payload and repeats shell.'},{title:'EPS reconciliation allowance',description:'Source EPS total 55 kg contains battery 7.06 kg and solar 17.537 kg. The 30.403 kg remainder is explicitly unallocated, not a verified PCU.'},{title:'Possible duplicate hardware',description:'Payload and ACS fine guidance sensors, and ACS and spacecraft computers may be dedicated or duplicate. They remain separate until resolved.'},{title:'Incomplete power and actuator data',description:'No solar output, battery Wh or actuator budget supplied. Nominal science instrument power is missing; all peak ratings are unprovided.'}]).map(x=>`<div class="checkitem"><div>${esc(x.title||x.id||x.issue||'Source observation')}<span class="explain">${esc(x.description||x.detail||x.message||x.finding||JSON.stringify(x))}</span></div>${tag('Review','warn')}</div>`).join('')}</div>`)}<div style="margin-top:20px">${panel('Engineering equations & limits',`<details open><summary>Geometry, mass and scope</summary><p>Hex segment area = √3 / 2 × flat-to-flat². Segment count = ceil(target circular aperture area × reflecting fill fraction / hex area). Bus count = ceil(segments / segments per bus) unless manually set. This estimates area only; edge packing is not solved. Per-segment, per-bus and once-per-observatory scopes are multiplied once.</p><div class="formula">Box shell area = 2(LW + LH + WH)<br>Hex shell area = 2 × √3/2 × F² + 6 × F/√3 × H<br>Shell CBE kg = area × thickness × density × coverage + internal allowance</div><p>The shell model is thin-wall and does not prove stiffness, launch survival, buckling or thermal distortion. Mirror supports / backplanes are separate unless included explicitly in a selected mirror’s extra areal mass. Dry mass margin is applied once; failed equipment mass remains installed.</p></details><details><summary>Solar, battery, power modes and energy balance</summary><div class="formula">Solar net EOL W = area × S₁AU / distanceAU² × cell efficiency × pointing × temperature × EOL × PMAD<br>Usable battery Wh = nameplate Wh × EOL retention × DoD × discharge efficiency<br>Average equipment W = operating units × [nominal W × duty + standby W × (1−duty)] + spare units × standby W</div><p>In net-rated solar mode, rated W is already net EOL bus power at the modeled operating point; loss factors and distance are not applied again. Failures reduce source output and storage but preserve mass. Peak loads are simultaneous peaks of operating loads with nonzero mode duty. No switching transients or inrush model is included. Power margin affects design requirements, not physical source ratings.</p><p>Each battery bank is constrained by its own usable energy, interval discharge limit, charge limit and efficiency. A feasible interval dispatch covers the modeled demand; a separate recharge allocation tests a repeatable cycle using sunlight surplus. Repeatable storage margin is output-replenishable bank energy minus required energy, so it is zero for the default no-eclipse case. Usable energy, discharge power and recharge power are checked separately. Generation and storage are aggregated; a positive observatory total does not establish local module closure without a power network.</p><p>Primary reference: <a href="https://www.nasa.gov/smallsat-institute/sst-soa/power-subsystems/" target="_blank" rel="noopener">NASA Small Spacecraft Technology — Power</a>.</p></details><details><summary>Propellant, reserve, tanks and burn time</summary><div class="formula">k = exp[Δv × (1 + reserve) / (9.80665 × Isp)] − 1<br>Loaded propellant = base dry CBE × (1 + margin) × k / [1 − (1 + k) × residual − (1 + margin) × tank fraction × k]<br>Additional tank kg = tank fraction × loaded propellant<br>Design dry = (base dry CBE + additional tank kg) × (1 + margin)<br>Wet design kg = design dry kg + loaded propellant kg</div><p>Dry propulsion hardware is included once. Unusable residual is a loaded-propellant fraction and reserve increases required delta-v. Negative / zero sizing denominator is infeasible. The model sizes a common ideal delta-v across evenly allocated module mass; define independent mass cases for heterogeneous assembly and transfer phases. It does not solve trajectories, finite-burn losses, launch injection, propellant settling, electric-thruster efficiency or thermal limits.</p><p>Burn duration estimates ideal propellant flow from thrust / (Isp × g₀), excluding unusable residual. Propellant volume excludes ullage, pressurant and feed plumbing. Primary reference: <a href="https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/ideal-rocket-equation/" target="_blank" rel="noopener">NASA Glenn — Ideal Rocket Equation</a>.</p></details><details><summary>Mirror / actuator trades and fault studies</summary><p>Areal substrate mass = area × kg/m², or volumetric mass = area × thickness × density × solid fraction. Extra support and coating areal masses are explicit. Actuator count, operating duty, standby load and peak are separate. WFE / resolution are stored trade inputs, not predictions of telescope performance; zero means unspecified.</p><p>Selected failures test available component count against the minimum required. Cold-spare switching, wheel geometry, common-cause failures, electrical topology and mission failure probability are unmodeled. Capture dependencies in each equipment record.</p><p>Primary references: <a href="https://science.nasa.gov/mission/webb/webbs-mirrors/" target="_blank" rel="noopener">NASA Webb mirrors</a>, <a href="https://www.nasa.gov/smallsat-institute/sst-soa/guidance-navigation-and-control/" target="_blank" rel="noopener">NASA Guidance, Navigation and Control</a>, <a href="https://ntrs.nasa.gov/api/citations/20110015733/downloads/20110015733.pdf" target="_blank" rel="noopener">NASA Common Cause Failure Modes</a>.</p></details>`)}</div><div style="margin-top:20px">${panel('Original workbook evidence',`<div class="horizontal" style="margin-bottom:15px"><label class="field"><span class="flabel">Worksheet</span><select id="sourcesheet">${AUDIT.sheets.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></label>${action('Download extracted source JSON','exportsource','','small ghost')}</div><div id="sourceviewer">${sourceTable(AUDIT.sheets[0])}</div>`)}</div><div style="margin-top:20px">${panel('Model diagnostics',`<div class="checklist">${[...(result.errors||[]),...(result.warnings||[])].map(w=>`<div class="checkitem"><div>${esc(typeof w==='string'?w:w.message||JSON.stringify(w))}</div>${tag('Review','warn')}</div>`).join('')||'<p>No calculation diagnostics.</p>'}</div><div class="tools" style="margin-top:18px">${action('Reset to workbook-seeded concept','reset','','danger small')}</div>`)}</div>`;}
function sourceTable(s){return `<div class="tablewrap"><table><thead><tr><th>Cell</th><th>Original value / cached result</th><th>Original formula</th></tr></thead><tbody>${s.rows.flatMap(r=>r.cells).map(c=>`<tr><td>${esc(c.cell)}</td><td class="sourcecell">${esc(c.value??'Blank')}</td><td class="sourcecell">${esc(c.formula||'—')}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No populated source cells.</td></tr>'}</tbody></table></div>`;}
function draw(){result=TelescopeModel.calculate(state);document.getElementById('mode').value=state.mission.mode;document.getElementById('projectlabel').innerHTML=esc(state.project.name)+' <span>Segmented · autonomously assembled</span>';document.getElementById('nav').innerHTML=pages.map(([id,label],i)=>`<button data-action="nav" data-id="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span class="num">${String(i+1).padStart(2,'0')}</span>${label}</button>`).join('');document.getElementById('content').innerHTML=({overview,architecture,components,power,control,trades,requirements,data}[page])()+`<div class="bottomline"><span>OPTICAL REEF · SYSTEMS ENGINEERING</span><span>Concept model v1.0 · All masses kg, powers W unless indicated</span></div>`;if(result.redundancy?.some(r=>!r.passes))document.getElementById('content').insertAdjacentHTML('afterbegin',note('Selected failures leave a required equipment count shortfall. Reduced electrical load does not imply an operable system. Review ACS & propulsion.','error'));if(result.errors?.length)document.getElementById('content').insertAdjacentHTML('afterbegin',note('Calculation infeasible: '+result.errors.map(x=>esc(typeof x==='string'?x:x.message||JSON.stringify(x))).join('; '),'error'));}
function persist(){state.metadata=state.metadata||{};state.metadata.updatedAt=new Date().toISOString();try{localStorage.setItem(STORE,JSON.stringify(state));return true;}catch(e){toast('Browser storage unavailable. Export project JSON to keep your changes.',true);return false;}}
function applyChange(path,value){const old=clone(state);set(state,path,value);if(path==='mission.massLimitKg'){const r=state.requirements.find(r=>r.id==='req_mass'&&r.metric==='wetPerBus'&&r.op==='<=');if(r)r.limit=value;}if(path==='structure.materialPreset'){if(value==='al')state.structure.densityKgM3=2700;if(value==='cfrp')state.structure.densityKgM3=1600;}if(path==='structure.densityKgM3')state.structure.materialPreset='custom';const v=ReefProject.validate(state);if(!v.valid){state=old;toast('Change rejected: '+v.errors.map(x=>typeof x==='string'?x:x.message||JSON.stringify(x)).slice(0,2).join('; '),true);}else{persist();document.getElementById('announcer').textContent='Model updated.';}draw();}
function toast(msg,error=false){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast'+(error?' error':'');el.setAttribute('role',error?'alert':'status');el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),6500);}
function download(name,data,type){const b=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function exportProject(){download('optical-reef-project.json',JSON.stringify(state,null,2),'application/json');toast('Project exported with inputs, linked trades and scenarios.');}
function exportHTML(){const doc=document.documentElement.cloneNode(true);doc.querySelector('#seed-data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');doc.querySelector('#modal').innerHTML='';doc.querySelectorAll('.toast').forEach(x=>x.remove());download('optical-reef-dashboard.html','<!doctype html>\n'+doc.outerHTML,'text/html');toast('Portable dashboard exported with the current project embedded.');}
function budgetCSV(){const cols=['name','subsystem','scope','massPerBusKg','totalMassKg','avgWPerBus','peakWPerBus'];const q=v=>'"'+String(v??'').replace(/^[=+@-]/,x=>"'"+x).replace(/"/g,'""')+'"';const rows=ledgerRows().map(l=>cols.map(k=>q(l[k])).join(','));download('optical-reef-budget.csv',cols.join(',')+'\r\n'+rows.join('\r\n'),'text/csv');}
function openModal(type,index=-1,object=null){modalType=type;editIndex=index;if(object)draft=clone(object);else{const key={component:'components',source:'sources',mirror:'mirrorTrades',actuator:'actuatorTrades',requirement:'requirements',family:'tradeSets'}[type];draft=clone(state[key][index]);}if(type==='component')draft.sourceComplete=Array.isArray(draft.missing)&&draft.missing.length===0;renderModal();}

led. Available spares fill the desired operating count; standby power is charged to the remaining available units.','cool')}`;}
if(modalType==='source'){title=editIndex<0?'Add power element':'Power element details';body=`<div class="fields">${input('Element name','name','',{...d,text:true,wide:true})}${select('Kind','kind',['solar','battery','constant'],d)}${select('Quantity basis','scope',scopeOpts,d)}${check('Include in study','enabled',true)}${input('Installed units','installed','',{...d,step:1})}${input('Failed units','failed','',{...d,step:1})}${input('Manual unit mass','massKg','kg',d)}${draft.kind==='solar'?`${select('Generation input','ratingMode',[['area','Area × flux × explicit losses'],['rated','Net EOL bus W at operating point']],d)}${input('Solar area per unit','areaM2','m²',d)}${input('Net EOL rated output','ratedW','W',d)}${input('Cell conversion efficiency','efficiency','0–1',{...d,max:1})}${input('Pointing cosine / factor','pointing','0–1',{...d,max:1})}${input('Temperature factor','temperature','0–1',{...d,max:1})}${input('EOL retention factor','eol','0–1',{...d,max:1})}${input('PMAD efficiency','pmad','0–1',{...d,max:1})}${select('Array mass basis','solarMassMode',[['manual','Manual mass per unit'],['area','Area × areal mass']],d)}${input('Array areal mass','arealMassKgM2','kg/m²',d)}`:draft.kind==='battery'?`${input('Nameplate energy per unit','energyWh','Wh',d)}${input('EOL capacity retention','eol','0–1',{...d,max:1})}${input('Allowable depth of discharge','dod','0–1',{...d,max:1})}${input('Charge efficiency','chargeEff','0–1',{...d,max:1,min:.001})}${input('Discharge efficiency','dischargeEff','0–1',{...d,max:1,min:.001})}${input('Maximum discharge per unit','maxDischargeW','W',d)}${input('Maximum charge per unit','maxChargeW','W',d)}${select('Battery mass basis','batteryMassMode',[['manual','Manual mass per unit'],['energy','Energy / specific energy']],d)}${input('Pack specific energy','specificWhKg','Wh/kg',{...d,min:.001})}`:`${input('Net continuous output per unit','ratedW','W',d)}`}${input('Data status','status','',{...d,text:true})}${input('Source / reference','source','',{...d,text:true,wide:true})}${ta('Assumptions and notes','notes')}</div>${note('Net EOL rated solar output bypasses the area model’s losses and distance correction. Batteries store energy; a constant source supplies sustained net W and must include its hardware / consumables in mass.','cool')}`;}
if(modalType==='mirror'){title=editIndex<0?'Add mirror trade':'Mirror substrate trade';body=`<div class="fields">${input('Trade option name','name','',{...d,text:true,wide:true})}${select('Mass model','massMode',[['areal','Areal kg/m²'],['solid','Geometry × density × solid fraction']],d)}${input('Areal substrate mass','arealKgM2','kg/m²',d)}${input('Bulk density','densityKgM3','kg/m³',{...d,min:.01})}${input('Blank thickness','thicknessMm','mm',{...d,min:.001})}${input('Remaining solid fraction','solidFraction','0–1',{...d,max:1,min:.001})}${input('Additional support areal mass','supportKgM2','kg/m²',d)}${input('Coating areal mass','coatingKgM2','kg/m²',d)}${input('WFE allocation (0 = TBD)','wfeNm','nm',d)}${input('TRL (0 = TBD)','trl','',{...d,step:1,max:9})}${input('CTE (stored trade metadata)','ctePpmK','ppm/K',{...d,min:-100})}${input('Operating temperature (metadata)','temperatureK','K',d)}${input('Source / reference','source','',{...d,text:true,wide:true})}${input('Data status','status','',{...d,text:true})}${ta('Notes','notes')}</div>${note('Backplane is a separate equipment record. Do not add its mass again here unless you remove it there. CTE and temperature are captured for future analyses; the mass model does not predict optical distortion.','cool')}`;}
if(modalType==='actuator'){title=editIndex<0?'Add actuator trade':'Mirror actuator trade';body=`<div class="fields">${input('Actuator option name','name','',{...d,text:true,wide:true})}${input('Count per mirror segment','countPerSegment','',{...d,step:1})}${input('Unit mass','massKg','kg',d)}${input('Operating power per unit','powerW','W',d)}${input('Peak power per unit','peakW','W',d)}${input('Standby power per unit','standbyW','W',d)}${input('Operating duty · all modes','duty','0–1',{...d,max:1})}${input('Stroke (0 = TBD)','strokeMm','mm',d)}${input('Resolution (0 = TBD)','resolutionNm','nm',d)}${input('Source / reference','source','',{...d,text:true,wide:true})}${input('Data status','status','',{...d,text:true})}${ta('Trade notes','notes')}</div>`;}
if(modalType==='requirement'){title=editIndex<0?'Add engineering requirement':'Edit requirement';body=`<div class="fields">${input('Requirement name','name','',{...d,text:true,wide:true})}${select('Linked result','metric',[['wetPerBus','Module wet design mass'],['avgPowerPerBus','Module actual average W'],['powerHeadroomPerBus','Module design power headroom'],['propellantPerBus','Module propellant mass'],['totalWet','Observatory wet design mass'],['wfeNm','Selected mirror WFE input'],['actuatorResolutionNm','Selected actuator resolution input']],d)}${select('Comparison','op',[['<=','At most (≤)'],['>=','At least (≥)']],d)}${input('Limit','limit','',{...d,min:-1e15})}${input('Unit label','unit','',{...d,text:true})}</div>`;}
if(modalType==='family'){title=editIndex<0?'Add trade family':'Trade family';body=`<div class="fields">${input('Trade family name','name','',{...d,text:true,wide:true})}${select('Target equipment','targetId',state.components.map(c=>[c.id,c.name]),d)}</div>${note('Each family may target one component; only one selected family may override that component. Options override unit mass, nominal power and peak power. Unit quantities and mode duties remain on the equipment record.','cool')}`;}

function saveModal(){if(modalType==='component'&&draft.sourceComplete===true)draft.missing=[];const candidate=clone(state);let key={component:'components',source:'sources',mirror:'mirrorTrades',actuator:'actuatorTrades',requirement:'requirements',family:'tradeSets'}[modalType];if(modalType==='option'){const [a,b]=String(editIndex).split(':').map(Number);if(b<0)candidate.tradeSets[a].options.push(draft);else candidate.tradeSets[a].options[b]=draft;}else{if(editIndex<0)candidate[key].push(draft);else candidate[key][editIndex]=draft;}if(modalType==='requirement'&&draft.id==='req_mass'&&draft.metric==='wetPerBus'&&draft.op==='<=')candidate.mission.massLimitKg=draft.limit;const v=ReefProject.validate(candidate);if(!v.valid){toast(v.errors.map(x=>typeof x==='string'?x:x.message||JSON.stringify(x)).slice(0,3).join('; '),true);return;}state=candidate;persist();closeModal();draw();toast('Saved. Budgets and linked requirements recalculated.');}
function closeModal(){document.getElementById('modal').innerHTML='';draft=null;modalType='';}
function baseComponent(subsystem='Custom'){return {id:uid('component'),name:'New component',subsystem,scope:'bus',enabled:true,installed:1,active:1,failed:0,minRequired:1,standbyW:0,massKg:0,powerW:0,peakW:0,duty:{science:1,assembly:1,maneuver:1,safe:1},source:'',status:'Missing data',notes:'Enter hardware data before treating the budget as complete.',vendor:'',model:'',url:'',sourceDate:'',ratingBasis:'TBD',dependencies:'',missing:['mass','power']};}
function removeItem(){if(!confirm('Remove this item from the project?'))return;const candidate=clone(state);const key={component:'components',source:'sources',mirror:'mirrorTrades',actuator:'actuatorTrades',requirement:'requirements',family:'tradeSets'}[modalType];if(modalType==='option'){const [a,b]=String(editIndex).split(':').map(Number),opt=candidate.tradeSets[a].options[b];if(candidate.tradeSets[a].selectedId===opt.id)candidate.tradeSets[a].selectedId='';candidate.tradeSets[a].options.splice(b,1);}else{const item=candidate[key][editIndex];if(modalType==='component'&&candidate.tradeSets.some(t=>t.targetId===item.id)){toast('Remove or retarget the linked trade family first.',true);return;}candidate[key].splice(editIndex,1);if(modalType==='mirror'&&candidate.mirrors.selectedId===item.id)candidate.mirrors.selectedId=candidate.mirrorTrades[0]?.id;if(modalType==='actuator'&&candidate.mirrors.actuatorId===item.id)candidate.mirrors.actuatorId=candidate.actuatorTrades[0]?.id;}const v=ReefProject.validate(candidate);if(!v.valid){toast('Cannot remove: '+v.errors.map(x=>typeof x==='string'?x:x.message||JSON.stringify(x)).slice(0,2).join('; '),true);return;}state=candidate;persist();closeModal();draw();}
document.addEventListener('change',e=>{const el=e.target;if(el.id==='mode'){applyChange('mission.mode',el.value);return;}if(el.hasAttribute('data-draft')){const val=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;if(el.type==='number'&&(!el.value||!el.validity.valid)){toast('Enter a valid value within the field limits.',true);return;}set(draft,el.dataset.draft,val);if(['kind','massMode'].includes(el.dataset.draft))renderModal();return;}if(el.hasAttribute('data-path')){if(el.type==='number'&&(!el.value||!el.validity.valid)){toast('Enter a valid value within the field limits.',true);draw();return;}applyChange(el.dataset.path,el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value);return;}if(el.id==='category'){category=el.value;draw();}if(el.id==='sourcesheet'){document.getElementById('sourceviewer').innerHTML=sourceTable(AUDIT.sheets.find(s=>s.name===el.value));}});
document.addEventListener('input',e=>{if(e.target.id==='filter'){filter=e.target.value;const p=e.target.selectionStart;draw();const f=document.getElementById('filter');f.focus();f.setSelectionRange(p,p);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&draft)closeModal();if(e.key==='Tab'&&draft){const els=[...document.querySelectorAll('.drawer button,.drawer input,.drawer select,.drawer textarea')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus();}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'nav':page=id;filter='';category='All systems';draw();window.scrollTo({top:0});break;case'export':exportProject();break;case'exporthtml':exportHTML();break;case'exportcsv':budgetCSV();break;case'exportsource':download('optical-reef-source-evidence.json',JSON.stringify({source:SOURCE,worksheets:AUDIT},null,2),'application/json');break;case'import':document.getElementById('importfile').click();break;case'snapshot':{if(state.snapshots.length>=ReefProject.MAX_SNAPSHOTS){toast('Export or remove a saved scenario before adding more (100 maximum).',true);break;}const name=document.getElementById('snapshotname')?.value.trim()||prompt('Name this scenario','Concept '+(state.snapshots.length+1));if(!name)return;const snap=clone(state);snap.snapshots=[];state.snapshots.push({id:uid('case'),name,created:new Date().toISOString(),state:snap});persist();draw();toast('Saved scenario: '+name);break;}case'restore':if(confirm('Restore this scenario? Current unsaved edits will be replaced.')){const snaps=state.snapshots;state=clone(snaps[Number(id)].state);state.snapshots=snaps;persist();draw();toast('Scenario restored.');}break;case'deletesnapshot':if(confirm('Delete this saved scenario?')){state.snapshots.splice(Number(id),1);persist();draw();}break;case'addcomponent':openModal('component',-1,baseComponent());break;case'addacs':openModal('component',-1,baseComponent('ACS'));break;case'editcomponent':openModal('component',Number(id));break;case'addsource':{const x=clone(SEED.sources[0]);x.id=uid('source');x.name='New '+id;x.kind=id;x.massKg=0;x.installed=1;x.failed=0;x.energyWh=0;x.ratedW=0;x.areaM2=0;x.source='';x.notes='Enter reviewed source data.';x.status='Assumption';openModal('source',-1,x);break;}case'editsource':openModal('source',Number(id));break;case'togglesource':applyChange('sources.'+id+'.enabled',!state.sources[id].enabled);break;case'selectmirror':applyChange('mirrors.selectedId',id);break;case'selectactuator':applyChange('mirrors.actuatorId',id);break;case'addmirror':{const x=clone(state.mirrorTrades[0]);x.id=uid('mirror');x.name='New mirror concept';x.source='Custom concept';x.notes='Enter reviewed material and geometry data.';x.status='Assumption';openModal('mirror',-1,x);break;}case'editmirror':openModal('mirror',Number(id));break;case'addactuator':{const x=clone(SEED.actuatorTrades[1]);x.id=uid('actuator');x.name='New actuator concept';openModal('actuator',-1,x);break;}case'editactuator':openModal('actuator',Number(id));break;case'addreq':openModal('requirement',-1,{id:uid('req'),name:'New allocation',metric:'wetPerBus',op:'<=',limit:2000,unit:'kg'});break;case'editreq':openModal('requirement',Number(id));break;case'addfamily':openModal('family',-1,{id:uid('family'),name:'New component trade',targetId:state.components[0].id,selectedId:'',options:[]});break;case'editfamily':openModal('family',Number(id));break;case'addoption':openModal('option',id+':-1',{id:uid('option'),name:'New hardware option',massKg:0,powerW:0,peakW:0,notes:''});break;case'editoption':{const [a,b]=id.split(':').map(Number);openModal('option',id,state.tradeSets[a].options[b]);break;}case'close':closeModal();break;case'savemodal':saveModal();break;case'removeitem':removeItem();break;case'duplicate':draft.id=uid('component');draft.name+=' (copy)';editIndex=-1;renderModal();break;case'clearfailures':state.components.forEach(c=>c.failed=0);state.sources.forEach(c=>c.failed=0);state.propulsion.failed=0;persist();draw();toast('Selected failures cleared.');break;case'reset':if(confirm('Reset the current project and saved scenarios to the initial workbook-seeded concept? Export first if you need a backup.')){state=clone(SEED);persist();draw();toast('Initial concept restored.');}break;}});
document.getElementById('importfile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error('Project is larger than 20 MB.');const incoming=JSON.parse(await f.text());const v=ReefProject.validate(incoming);if(!v.valid)throw Error(v.errors.map(x=>typeof x==='string'?x:x.message||JSON.stringify(x)).slice(0,4).join('; '));if(!confirm('Replace the active project with '+f.name+'? Export the current project first if you need it.'))return;state=incoming;persist();draw();toast('Project imported and recalculated.');}catch(err){toast('Import rejected: '+err.message,true);}finally{e.target.value='';}});
draw();
globalThis.ReefApp={getState:()=>clone(state),getResult:()=>clone(result),setPage:p=>{if(pages.some(x=>x[0]===p)){page=p;draw();}},getPage:()=>page};
})();
</script>
</body></html>
